<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jess is a public sector UX designer creating simple, accessible, and inclusive government services." />
    <meta name="theme-color" content="#fff9f0" />
    <title>Jess, Public Sector UX Designer</title>
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      ;(function () {
        var t
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:1rem;font-family:system-ui">This portfolio needs JavaScript to show its Work, Art, and Contact sections.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
